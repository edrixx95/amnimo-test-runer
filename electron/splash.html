<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amnimo Test Runner</title>
  <style>
    :root {
      --primary: #0284c7; /* Amnimo blueish */
      --bg: #0f172a; /* Dark background */
      --text: #f8fafc;
    }
    
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      -webkit-app-region: drag; /* Allows dragging the borderless window */
      user-select: none;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    /* Modern abstract logo animation */
    .logo-wrapper {
      position: relative;
      width: 80px;
      height: 80px;
    }

    .circle {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 3px solid transparent;
      border-top-color: var(--primary);
      animation: spin 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
    }

    .circle:nth-child(2) {
      width: 70%;
      height: 70%;
      top: 15%;
      left: 15%;
      border-top-color: #38bdf8;
      animation-duration: 1.5s;
      animation-direction: reverse;
    }
    
    .circle:nth-child(3) {
      width: 40%;
      height: 40%;
      top: 30%;
      left: 30%;
      border-top-color: #7dd3fc;
      animation-duration: 2s;
    }

    .title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin: 0;
      background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 13px;
      color: #94a3b8;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
      animation: pulse 2s infinite opacity;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-wrapper">
      <div class="circle"></div>
      <div class="circle"></div>
      <div class="circle"></div>
    </div>
    <div style="text-align: center;">
      <h1 class="title">Amnimo Test Runner</h1>
      <p class="subtitle mt-2">Starting Engine...</p>
    </div>
  </div>
</body>
</html>
